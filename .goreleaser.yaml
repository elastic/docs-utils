version: 2

project_name: docs-harness

before:
  hooks:
    - go mod tidy

builds:
  - id: docs-harness
    main: ./cmd/docs-harness
    binary: docs-harness
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.txt
      - NOTICE.txt
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: elastic
    name: docs-harness
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    ## Install

    ```bash
    curl -sSL https://github.com/elastic/docs-harness/releases/latest/download/install.sh | bash
    ```

    Or on Windows (PowerShell):
    ```powershell
    irm https://github.com/elastic/docs-harness/releases/latest/download/install.ps1 | iex
    ```
